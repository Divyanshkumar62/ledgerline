# One command: `docker compose up --build`
# Starts PostgreSQL, Kafka and Ledger Line, then runs a walkthrough (`demo`) against the API and exits.
# Infrastructure only (for `./gradlew bootRun` on the host): `docker compose up -d postgres kafka`
services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerline}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerline_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerline} -d ${POSTGRES_DB:-ledgerline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft broker for the outbox relay (ADR-007). Two listeners:
  #   kafka:19092     for other containers (the app)
  #   localhost:9092  for tools on the host (bootRun, kafka CLI)
  # Topics ledger.transfers.v1 / ledger.accounts.v1 are auto-created on first publish.
  kafka:
    image: apache/kafka-native:3.8.0
    container_name: ledgerline-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  ledgerline:
    build: .
    image: ledgerline:0.1.0
    container_name: ledgerline-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledgerline}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ledgerline}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ledgerline_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # First admin key (dev only). Override ADMIN_KEY in .env; never reuse this value outside your machine.
      LEDGERLINE_BOOTSTRAP_ADMIN_KEY: ${ADMIN_KEY:-dev-admin-key-change-me-0123456789}
    ports:
      - "${APP_PORT:-8080}:8080"
    # healthcheck (readiness probe) is defined in the Dockerfile

  # Walkthrough + smoke test: prints PASS/FAIL per guarantee, then exits (non-zero on any failure).
  demo:
    image: curlimages/curl:8.10.1
    container_name: ledgerline-demo
    depends_on:
      ledgerline:
        condition: service_healthy
    environment:
      BASE_URL: http://ledgerline:8080
      PUBLIC_URL: http://localhost:${APP_PORT:-8080}
      ADMIN_KEY: ${ADMIN_KEY:-dev-admin-key-change-me-0123456789}
    volumes:
      - ./scripts/demo.sh:/demo.sh:ro
    entrypoint: ["sh", "/demo.sh"]
    restart: "no"

volumes:
  postgres_data:
