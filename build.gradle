plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
}

checkstyle {
	// config/checkstyle/checkstyle.xml is picked up by convention
	maxWarnings = 0
}

group = 'com.ledgerline'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.flywaydb:flyway-database-postgresql'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testImplementation 'org.testcontainers:testcontainers-toxiproxy'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Fixed name so the Dockerfile (and anyone scripting a deploy) doesn't need to know the version.
tasks.named('bootJar') {
	archiveFileName = 'ledgerline.jar'
}

tasks.withType(Test).configureEach {
	// Windows reports the legacy zone "Asia/Calcutta", which postgres:16 rejects on connect.
	systemProperty 'user.timezone', 'UTC'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'benchmark'
	}
}

// Locking-strategy comparison for ADR-002. Not part of `check`: it is slow and its numbers
// depend on the machine. Run explicitly: ./gradlew benchmark
tasks.register('benchmark', Test) {
	description = 'Benchmarks the three concurrency strategies (throughput, p50/p95/p99, rejection rate).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'benchmark'
	}
	outputs.upToDateWhen { false }
	testLogging.showStandardStreams = true
}
