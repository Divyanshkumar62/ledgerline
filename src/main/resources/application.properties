spring.application.name=ledgerline

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flush UPDATEs sorted by primary key. Strategy B writes balances only at flush time, so without
# this two transactions touching A and B could update them in opposite orders and deadlock (40P01).
spring.jpa.properties.hibernate.order_updates=true
