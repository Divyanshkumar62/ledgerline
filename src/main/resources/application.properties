spring.application.name=ledgerline

# Local defaults match docker-compose.yml, so `./gradlew bootRun` works with no arguments.
# In containers they are overridden by SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerline
spring.datasource.username=ledgerline
spring.datasource.password=ledgerline_secret

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flush UPDATEs sorted by primary key. Strategy B writes balances only at flush time, so without
# this two transactions touching A and B could update them in opposite orders and deadlock (40P01).
spring.jpa.properties.hibernate.order_updates=true

# --- Kafka producer (outbox relay, ADR-007) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast while the broker is down: the relay holds a DB transaction while it waits for acks.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=4000

# --- Background workers ---
spring.task.scheduling.pool.size=2
ledgerline.outbox.relay.enabled=true
ledgerline.outbox.relay.poll-interval-ms=200
ledgerline.outbox.relay.batch-size=100
ledgerline.audit.enabled=true
ledgerline.audit.interval-ms=60000
# Postings younger than this are verified but not yet folded into a checkpoint (ADR-008).
ledgerline.audit.checkpoint-lag=60s

# --- Retention (ADR-009). Ledger tables are never purged. ---
ledgerline.retention.cron=0 17 * * * *
ledgerline.retention.outbox-published=7d
# A retry with a purged key executes again: keep this longer than any client's retry window.
ledgerline.retention.idempotency=7d

# --- Security (ADR-011) ---
# First admin key, used only if no "admin" client exists yet. Empty = no bootstrap admin.
# docker-compose.yml sets a development value; supply a real secret from the environment elsewhere.
ledgerline.security.bootstrap-admin-key=${LEDGERLINE_BOOTSTRAP_ADMIN_KEY:}

# --- Observability (Week 7) ---
# Every log line carries the request's correlation fields (empty outside a request).
logging.pattern.level=%5p [trace_id=%X{trace_id:-} client_id=%X{client_id:-} idempotency_key=%X{idempotency_key:-} source_account_id=%X{source_account_id:-} target_account_id=%X{target_account_id:-}]
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
